<body style="overflow: hidden; width: 100%; height: 100%; margin: 0; padding: 0;">

        <div class="top-tabs-container">
            <button id="btn-list" class="nav-btn nav-tab" aria-label="List of poems" title="List of poems">

            </button>
            <button id="btn-random" class="nav-btn nav-tab" aria-label="Random poem" title="Random poem">
                <i class="bi bi-dice-5"></i>

        </div>

        <div id="graph-container">
            <svg id="graph-edges" class="graph-edges-layer" width="100%" height="100%"></svg>
        </div>
